name: XR18Panel
options:
  bundleIdPrefix: sk.palkoskoda
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  XR18Core:
    path: Packages/XR18Core
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  XR18Panel:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, XR18Panel.entitlements]
    dependencies:
      - package: XR18Core
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: XR18 Bubble
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: false
        NSLocalNetworkUsageDescription: Connect to your selected mixer and read its current controls and meters.
        NSLocationWhenInUseUsageDescription: Read the current Wi-Fi name to offer a return to that network after using your mixer. Your location is not stored or shared.
    entitlements:
      path: App/XR18Panel.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
        com.apple.developer.networking.wifi-info: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.palkoskoda.xr18panel
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  XR18PanelTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: XR18Panel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  XR18PanelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: XR18Panel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  XR18Panel:
    build:
      targets:
        XR18Panel: all
    test:
      targets: [XR18PanelTests, XR18PanelUITests]
      gatherCoverageData: true
